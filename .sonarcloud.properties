# This file is used by the SonarCloud GitHub App to configure the SonarCloud Automatic Analysis.
# https://sonarcloud.io/project/overview?id=nrfconnect_sdk-nrf

# SonarCloud project details
sonar.projectKey=nrfconnect_sdk-nrf-testing
sonar.organization=nrfconnect
sonar.projectName=sdk-nrf-testing
sonar.projectVersion=1.0

# Path to sources
sonar.sources=.
sonar.exclusions=**/build/**,**/build_*/**,**/.west/**,**/zephyr/**,**/modules/hal_nordic/**,**/modules/mbedtls/**,**/modules/mcuboot/**,**/bootloader/**,**/*.bin,**/*.hex,**/*.elf,**/*.map,**/*.a,**/*.o,**/*.so,**/*.dll,**/generated/**,**/doc/_build/**,**/doc/build/**,**/__pycache__/**,**/*.pyc,**/.git/**,**/.pytest_cache/**,**/node_modules/**,**/CMakeFiles/**,**/CMakeCache.txt,**/*.cmake
sonar.inclusions=**/*.c,**/*.cpp,**/*.cc,**/*.cxx,**/*.h,**/*.hpp,**/*.hxx,**/*.py,**/*.rst,**/*.md,**/*.txt,**/*.cmake,**/*.conf,**/*.overlay,**/*.dts,**/*.dtsi,**/*.yaml,**/*.yml,**/*.json,**/CMakeLists.txt,**/Kconfig*,**/prj.conf

# Path to tests
sonar.tests=**/tests/**/*
# sonar.test.exclusions=
# sonar.test.inclusions=

# Exclusions for copy-paste detection
sonar.cpd.exclusions=**/tests/**/*, **/doc/_utils/redi*

# Python version (for python projects only)
sonar.python.version=3.12

# Source encoding
sonar.sourceEncoding=UTF-8

# Pull Request Options
sonar.pullrequest.github.summary_comment=false

# Language.C
sonar.cfamily.customTargetArch=arm
sonar.cfamily.customTargetVendor=unknown
sonar.cfamily.customTargetSystem=linux
sonar.cfamily.customTargetEnv=gnueabi
